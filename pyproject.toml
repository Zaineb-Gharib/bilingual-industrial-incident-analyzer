[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "bilingual-industrial-incident-analyzer"
version = "0.1.0"
description = "Provider-neutral EN/ZH industrial incident structuring and prompt evaluation"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Zaineb Gharib"}]
dependencies = [
    "openai>=1.60,<3",
    "pandas>=2.2,<3",
    "plotly>=5.24,<7",
    "pydantic>=2.8,<3",
    "streamlit>=1.40,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "live_api: opt-in test that can call a configured external API",
]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["work", "outputs", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
per-file-ignores = {"scripts/*.py" = ["E402"]}

[tool.ruff.format]
quote-style = "double"
